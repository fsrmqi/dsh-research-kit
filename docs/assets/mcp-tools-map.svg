<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 556" width="820" height="556" role="img" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>MCP 工具地图：四类宿主经同一 stdio 服务调用按能力域分组的 research_* 工具</title>
<desc>上层是任意支持 MCP 的宿主；中层是单一 stdio 服务，工具按能力域分组，绝大多数只读或外呼，两个能力域含写操作且必须显式确认；下层是入口级与细粒度两级分工的诚实边界。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="30" y="30" width="760" height="70" rx="14" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="50" y="52" font-size="14" font-weight="500" fill="#2C2C2A">宿主侧：任意支持 MCP 的客户端</text>
<text x="290" y="52" font-size="12" fill="#5F5E5A">同一份启动命令，按宿主各写一次配置</text>
<rect x="50" y="66" width="178" height="26" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="139" y="79" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">Codex</text>
<rect x="240" y="66" width="178" height="26" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="329" y="79" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">Claude Code</text>
<rect x="430" y="66" width="178" height="26" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="519" y="79" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">Zed</text>
<rect x="620" y="66" width="178" height="26" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="709" y="79" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">DSH 会话</text>

<path d="M410 100 L410 126" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<text x="422" y="118" font-size="12" fill="#5F5E5A">stdio · MCP 协议</text>

<rect x="30" y="132" width="760" height="336" rx="14" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="50" y="156" font-size="14" font-weight="500" fill="#3C3489">dsh-research-kit MCP Server</text>
<text x="300" y="156" font-size="12" fill="#534AB7">单一 stdio 进程 · 工具名统一 research_ 前缀 · 不持有任何 API Key</text>

<rect x="50" y="170" width="233" height="54" rx="10" fill="#FFFFFF" stroke="#CECBF6" stroke-width="0.5"/>
<text x="166" y="193" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle">工具导航</text>
<text x="166" y="212" font-size="12" fill="#7F77DD" text-anchor="middle">按目标推荐工具与最短调用链</text>

<rect x="293" y="170" width="233" height="54" rx="10" fill="#FFFFFF" stroke="#CECBF6" stroke-width="0.5"/>
<text x="409" y="193" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle">目录检索</text>
<text x="409" y="212" font-size="12" fill="#7F77DD" text-anchor="middle">搜索工作流、技能与数据源</text>

<rect x="536" y="170" width="233" height="54" rx="10" fill="#FFFFFF" stroke="#CECBF6" stroke-width="0.5"/>
<text x="652" y="193" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle">工作流组装</text>
<text x="652" y="212" font-size="12" fill="#7F77DD" text-anchor="middle">填参数生成可发送 Prompt</text>

<rect x="50" y="232" width="233" height="54" rx="10" fill="#FFFFFF" stroke="#CECBF6" stroke-width="0.5"/>
<rect x="225" y="242" width="48" height="18" rx="9" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
<text x="249" y="251" font-size="10" fill="#185FA5" text-anchor="middle" dominant-baseline="central">外呼 API</text>
<text x="166" y="255" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle">数据源与引用</text>
<text x="166" y="274" font-size="12" fill="#7F77DD" text-anchor="middle">查询数据源 · 验证引用</text>

<rect x="293" y="232" width="233" height="54" rx="10" fill="#FFFFFF" stroke="#CECBF6" stroke-width="0.5"/>
<rect x="468" y="242" width="48" height="18" rx="9" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
<text x="492" y="251" font-size="10" fill="#185FA5" text-anchor="middle" dominant-baseline="central">外呼 API</text>
<text x="409" y="255" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle">文献检索</text>
<text x="409" y="274" font-size="12" fill="#7F77DD" text-anchor="middle">综合检索 · 文献互引分析</text>

<rect x="536" y="232" width="233" height="54" rx="10" fill="#FFFFFF" stroke="#CECBF6" stroke-width="0.5"/>
<rect x="711" y="242" width="48" height="18" rx="9" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
<text x="735" y="251" font-size="10" fill="#185FA5" text-anchor="middle" dominant-baseline="central">外呼 API</text>
<text x="652" y="255" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle">元数据获取</text>
<text x="652" y="274" font-size="12" fill="#7F77DD" text-anchor="middle">按 DOI 取 OpenAlex 元数据</text>

<rect x="50" y="294" width="233" height="54" rx="10" fill="#FFFFFF" stroke="#CECBF6" stroke-width="0.5"/>
<text x="166" y="317" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle">图表生成</text>
<text x="166" y="336" font-size="12" fill="#7F77DD" text-anchor="middle">生成图表 · 可用风格列表</text>

<rect x="293" y="294" width="233" height="54" rx="10" fill="#FFFFFF" stroke="#CECBF6" stroke-width="0.5"/>
<rect x="468" y="304" width="48" height="18" rx="9" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
<text x="492" y="313" font-size="10" fill="#185FA5" text-anchor="middle" dominant-baseline="central">外呼 API</text>
<text x="409" y="317" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle">写作与引用审阅</text>
<text x="409" y="336" font-size="12" fill="#7F77DD" text-anchor="middle">质量 · 异常 · 限制语 · 引用审计</text>

<rect x="536" y="294" width="233" height="54" rx="10" fill="#FFFFFF" stroke="#CECBF6" stroke-width="0.5"/>
<text x="652" y="317" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle">AI 披露生成</text>
<text x="652" y="336" font-size="12" fill="#7F77DD" text-anchor="middle">生成披露 · 政策列表</text>

<rect x="50" y="360" width="719" height="84" rx="10" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5"/>
<text x="66" y="382" font-size="12" font-weight="500" fill="#854F0B">会改变仓库状态的能力域 · 调用前需显式确认</text>
<rect x="66" y="392" width="345" height="42" rx="8" fill="#FFFFFF" stroke="#FAC775" stroke-width="0.5"/>
<text x="238" y="408" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">证据库 · 写入侧</text>
<text x="238" y="425" font-size="11" fill="#854F0B" text-anchor="middle">保存证据 · 批量保存 · 关联证据 · 应用分级</text>
<rect x="423" y="392" width="345" height="42" rx="8" fill="#FFFFFF" stroke="#FAC775" stroke-width="0.5"/>
<text x="595" y="408" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">研究运行 · 写入侧</text>
<text x="595" y="425" font-size="11" fill="#854F0B" text-anchor="middle">启动研究运行 · 导出护照 · 审批检查点</text>

<rect x="30" y="480" width="760" height="60" rx="14" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="50" y="504" font-size="12" fill="#085041">工具分「入口级」与「细粒度」两级：入口负责导航与组装，细粒度执行单步动作，避免一次调用拉回整份目录。</text>
<text x="50" y="524" font-size="12" fill="#0F6E56">查询与核验只返回来源与稳定标识符；未接通的来源明确回退，不伪造检索结果。</text>
</svg>
