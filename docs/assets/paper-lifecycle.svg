<path d="M186 208 L152 208" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#ap)"/>
<circle cx="169" cy="208" r="10" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5"/>
<rect x="166.5" y="203" width="1.6" height="10" rx="0.8" fill="#854F0B"/>
<rect x="170" y="203" width="1.6" height="10" rx="0.8" fill="#854F0B"/>

<rect x="30" y="176" width="118" height="64" rx="10" fill="#FFFFFF" stroke="#CECBF6" stroke-width="0.5"/>
<text x="89" y="200" font-size="10" fill="#888780" text-anchor="middle">阶段 6</text>
<text x="89" y="222" font-size="13" font-weight="500" fill="#26215C" text-anchor="middle">过程记录</text>

<circle cx="44" cy="272" r="10" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5"/>
<rect x="41.5" y="267" width="1.6" height="10" rx="0.8" fill="#854F0B"/>
<rect x="45" y="267" width="1.6" height="10" rx="0.8" fill="#854F0B"/>
<text x="64" y="276" font-size="12" fill="#5F5E5A">必经的人工确认闸门：流程在此暂停，等你确认才继续</text>

<rect x="34" y="292" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5"/>
<text x="64" y="302" font-size="12" fill="#5F5E5A">琥珀底的两处完整性检查为强制检查点</text>

<rect x="30" y="330" width="760" height="62" rx="12" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="410" y="353" font-size="12" fill="#444441" text-anchor="middle">也可以不走流水线：任一阶段都能用单点工作流单独进入</text>
<text x="410" y="375" font-size="12" fill="#5F5E5A" text-anchor="middle">每阶段产出均为「需人工核验的草案」· 不编造文献与数据 · 不替代同行评审</text>
</svg>
