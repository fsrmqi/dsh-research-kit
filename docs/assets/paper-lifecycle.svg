<text x="409" y="222" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">终完整性检查</text>

<path d="M346 208 L312 208" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#ap)"/>
<circle cx="329" cy="208" r="10" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5"/>
